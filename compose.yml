services:
  household-front:
    build:
      context: ./src/kanntan-kakeibo
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Tokyo
      PORT: 8080
      BACKEND_HOST: kakeibo-app.local
    volumes:
      - ./docker/nginx/household-front.local.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "5174:8080"
    depends_on:
      - kakeibo-app
    networks:
      - household-network

  credit-card-front:
    build:
      context: ./src/credit-card-front
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Tokyo
      PORT: 8080
      BACKEND_HOST: kakeibo-app.local
    volumes:
      - ./docker/nginx/household-front.local.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "${CREDIT_CARD_FRONT_PORT:-5175}:8080"
    depends_on:
      - kakeibo-app
    networks:
      - household-network

  kakeibo-app:
    build:
      context: ./src/kakeibo
      dockerfile: Dockerfile
    env_file:
      - ./src/kakeibo/.env
    environment:
      TZ: Asia/Tokyo
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8080
      PORT: 8080
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      SESSION_SECURE_COOKIE: "false"
      SESSION_SAME_SITE: lax
      FRONTEND_ORIGINS: http://localhost:5174,http://localhost:${CREDIT_CARD_FRONT_PORT:-5175}
      LOG_CHANNEL: stderr
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      household-network:
        aliases:
          - kakeibo-app.local

  db:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - household-network

networks:
  household-network:

volumes:
  mysql-data:
