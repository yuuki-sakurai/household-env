services:
  household-front:
    image: node:22.23.1-alpine3.24
    working_dir: /app
    volumes:
      - ./src/kanntan-kakeibo:/app
      - household-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev -- --port 5174 --strictPort"
    environment:
      TZ: Asia/Tokyo
      API_PROXY_TARGET: http://kakeibo-web
    ports:
      - "5174:5174"
    depends_on:
      - kakeibo-web
    networks:
      - household-network

  credit-card-front:
    image: node:22.23.1-alpine3.24
    working_dir: /app
    volumes:
      - ./src/credit-card-front:/app
      - credit-card-node-modules:/app/node_modules
    command: sh -c "npm ci && npm run dev"
    environment:
      TZ: Asia/Tokyo
      API_PROXY_TARGET: http://kakeibo-web
    ports:
      - "${CREDIT_CARD_FRONT_PORT:-5175}:5175"
    depends_on:
      - kakeibo-web
    networks:
      - household-network

  kakeibo-app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./src/kakeibo:/var/www/html
      - kakeibo-vendor:/var/www/html/vendor
    environment:
      TZ: Asia/Tokyo
    depends_on:
      db:
        condition: service_healthy
    networks:
      - household-network

  kakeibo-web:
    image: nginx:stable-alpine
    ports:
      - "8080:80"
    volumes:
      - ./src/kakeibo:/var/www/html:ro
      - ./docker/nginx/kakeibo.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - kakeibo-app
    networks:
      - household-network

  db:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      TZ: Asia/Tokyo
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${DB_ROOT_PASSWORD}"
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - household-network

networks:
  household-network:

volumes:
  mysql-data:
  kakeibo-vendor:
  household-node-modules:
  credit-card-node-modules:
